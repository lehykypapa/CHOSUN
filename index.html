        // -------------------------------------------------------------------
        // 7. ACTIVE GAME VIEW & 60FPS LOOP
        // -------------------------------------------------------------------
        function startRoleGame(role) {
          stopGameLoop();
          appState.activeRole = role;

          var g = {
            role: role,
            stepIndex: 0,
            reputation: 100,
            carryingItem: null,
            nearbyNpc: null,
            toastMsg: null,
            toastTimer: 0,
            dialogueModal: null,
            quizModalOpen: false,
            quizIndex: 0,
            quizFeedback: null,
            failureInfo: null,
            missionCleared: false,
            showNotebook: false,
            showMinimap: false,
            discoveredTips: [],
            player: {
              x: role.startPos.x,
              y: role.startPos.y,
              vx: 0,
              vy: 0,
              facing: 'down',
              isBowing: false,
              carryingItem: null,
              walkTime: 0,
              role: role,
              bubbleText: null,
              rudeFlashTimer: 0
            },
            playerBubbleTimer: 0,
            npcs: createInitialNpcs(),
            royal: {
              phase: 'IDLE',
              timer: 22,
              x: -140,
              y: (ROYAL_ROAD_Y_MIN + ROYAL_ROAD_Y_MAX) / 2
            },
            keys: {},
            joystickVec: { x: 0, y: 0 }
          };
          appState.game = g;

          buildGameShell();
          syncGameHudDom();

          var canvas = document.getElementById('game-canvas');
          var ctx = canvas.getContext('2d');
          var lastTime = performance.now();
          var elapsedTotal = 0;
          var uiAccum = 0;

          function isPaused() {
            return Boolean(g.dialogueModal || g.quizModalOpen || g.failureInfo || g.missionCleared || g.showNotebook || g.showMinimap);
          }

          function showToast(msg) {
            g.toastMsg = msg;
            g.toastTimer = 3.2;
            syncGameHudDom();
          }

          function recordTip(npcName, roleTitle, tip) {
            if (!g.discoveredTips.some(function (t) { return t.npcName === npcName; })) {
              g.discoveredTips.push({ npcName: npcName, roleTitle: roleTitle, tip: tip });
            }
          }

          function triggerFailure(info) {
            SoundEngine.playPenalty();
            g.reputation = Math.max(0, g.reputation - 35);
            g.keys = {};
            g.joystickVec = { x: 0, y: 0 };
            g.failureInfo = info;
            syncGameHudDom();
            renderGameModalOverlay();
          }

          function advanceQuestStep() {
            var step = g.role.steps[g.stepIndex];
            if (!step) return;
            if (step.grantsCarry) {
              g.carryingItem = step.grantsCarry;
              g.player.carryingItem = step.grantsCarry;
              showToast("'" + step.grantsCarry + "'을(를) 챙겼습니다!");
            } else if (step.requiresCarry) {
              g.carryingItem = null;
              g.player.carryingItem = null;
            }
            if (step.triggersRoyalEvent && g.royal.phase === 'IDLE') {
              g.royal.timer = 1.8;
            }
            if (g.stepIndex + 1 >= g.role.steps.length) {
              SoundEngine.playMissionClear();
              g.missionCleared = true;
              if (appState.clearedRoles.indexOf(g.role.id) === -1) {
                appState.clearedRoles.push(g.role.id);
                saveClearedRoles(appState.clearedRoles);
              }
              renderGameModalOverlay();
            } else {
              SoundEngine.playStepComplete();
              g.stepIndex += 1;
            }
            syncGameHudDom();
          }

          function toggleBow() {
            if (isPaused()) return;
            g.player.isBowing = !g.player.isBowing;
            if (g.player.isBowing) {
              SoundEngine.playBow();
              g.player.bubbleText = g.royal.phase !== 'IDLE' ? '엎드려 절합니다!' : '문안 인사 올립니다!';
              g.playerBubbleTimer = 1.6;
            } else {
              g.player.bubbleText = null;
            }
            syncGameHudDom();
          }

          function triggerRudeAction() {
            if (isPaused()) return;
            g.player.rudeFlashTimer = 0.45;
            g.player.isBowing = false;
            var p = g.player;
            if (g.royal.phase === 'PASSING') {
              triggerFailure({
                reasonTitle: '임금님 어가 행렬을 향해 무례한 행동을 했습니다!',
                historicalFeedback: '조선시대에는 임금님의 어가가 지나갈 때 모두 길가로 비켜 예를 갖추어야 했어요. 왕 앞에서의 무례함은 가장 큰 벌을 받았습니다.'
              });
              return;
            }
            var nearbyHigher = g.npcs.find(function (n) {
              return mustBowToNpc(g.role.rank, n.rank) && Math.hypot(n.currentX - p.x, n.currentY - p.y) < 135;
            });
            if (nearbyHigher) {
              triggerFailure({
                reasonTitle: nearbyHigher.name + '(' + nearbyHigher.roleTitle + ')께 무례한 행동을 했습니다!',
                historicalFeedback: '조선시대에는 신분 질서가 매우 엄격했어요. ' + g.role.rankLabel + '이(가) 윗 신분인 ' + nearbyHigher.roleTitle + '에게 거칠게 행동하면 불경죄로 관아에 끌려갔습니다.'
              });
              return;
            }
            SoundEngine.playInteract();
            p.bubbleText = '조심해서 행동해야지...';
            g.playerBubbleTimer = 1.5;
            g.reputation = Math.max(20, g.reputation - 5);
            syncGameHudDom();
          }

          function handleInteract() {
            if (isPaused()) return;
            var p = g.player;
            var closest = null;
            var bestDist = 88;
            for (var i = 0; i < g.npcs.length; i++) {
              var n = g.npcs[i];
              var d = Math.hypot(n.currentX - p.x, n.currentY - p.y);
              if (d < bestDist) {
                bestDist = d;
                closest = n;
              }
            }
            if (!closest) return;

            if (mustBowToNpc(g.role.rank, closest.rank) && closest.greetedTimer <= 0 && !p.isBowing) {
              SoundEngine.playInteract();
              closest.bubbleText = '먼저 예절(Q)을 갖추어 인사하거라!';
              closest.bubbleTimer = 2.2;
              showToast(closest.name + '(' + closest.roleTitle + ')께 먼저 예절 버튼을 눌러 인사하세요!');
              return;
            }

            if (mustBowToNpc(g.role.rank, closest.rank)) {
              closest.greetedTimer = 9;
              closest.approachWarningTimer = 0;
            }

            SoundEngine.playInteract();
            recordTip(closest.name, closest.roleTitle, closest.historyTip);
            g.keys = {};
            g.joystickVec = { x: 0, y: 0 };

            var activeStep = g.role.steps[g.stepIndex];
            if (activeStep && closest.id === activeStep.targetNpcId) {
              if (activeStep.triggersQuiz) {
                g.quizIndex = 0;
                g.quizFeedback = null;
                g.quizModalOpen = true;
                renderGameModalOverlay();
                return;
              }
              g.dialogueModal = {
                npcName: closest.name,
                npcRole: closest.roleTitle,
                text: activeStep.completionLine,
                historyTip: closest.historyTip,
                advancesQuest: true
              };
              syncGameHudDom();
              renderGameModalOverlay();
              return;
            }

            var normalLine = mustBowToNpc(g.role.rank, closest.rank)
              ? closest.higherRankReply
              : (g.role.rank >= 2 && closest.rank < g.role.rank ? closest.lowerRankReply : closest.defaultGreeting);

            g.dialogueModal = {
              npcName: closest.name,
              npcRole: closest.roleTitle,
              text: normalLine,
              historyTip: closest.historyTip,
              advancesQuest: false
            };
            syncGameHudDom();
            renderGameModalOverlay();
          }

          function respawnPlayer() {
            g.player.x = g.role.startPos.x;
            g.player.y = g.role.startPos.y;
            g.player.vx = 0;
            g.player.vy = 0;
            g.player.isBowing = false;
            g.player.bubbleText = null;
            g.player.rudeFlashTimer = 0;
            g.reputation = 100;
            g.npcs = createInitialNpcs();
            g.royal = { phase: 'IDLE', timer: 20, x: -140, y: (ROYAL_ROAD_Y_MIN + ROYAL_ROAD_Y_MAX) / 2 };
            g.failureInfo = null;
            g.keys = {};
            g.joystickVec = { x: 0, y: 0 };
            syncGameHudDom();
            renderGameModalOverlay();
          }

          // Wire game shell buttons
          document.getElementById('btn-exit-menu').onclick = function () {
            window.removeEventListener('keydown', onKeyDown);
            window.removeEventListener('keyup', onKeyUp);
            appState.activeRole = null;
            appState.game = null;
            if (appState.clearedRoles.length === ROLES.length) {
              appState.showMasterEnding = true;
            }
            renderMenuScreen();
          };
          document.getElementById('btn-open-map').onclick = function () { g.showMinimap = true; g.keys = {}; renderGameModalOverlay(); };
          document.getElementById('btn-open-notebook').onclick = function () { g.showNotebook = true; g.keys = {}; renderGameModalOverlay(); };
          document.getElementById('btn-toggle-mute').onclick = function () {
            SoundEngine.muted = !SoundEngine.muted;
            syncGameHudDom();
          };
          document.getElementById('btn-royal-bow').onclick = toggleBow;
          document.getElementById('btn-action-bow').onclick = toggleBow;
          document.getElementById('btn-action-talk').onclick = handleInteract;
          document.getElementById('btn-action-rude').onclick = triggerRudeAction;

          // Virtual Joystick Pointer Events
          var joyZone = document.getElementById('joystick-zone');
          var joyKnob = document.getElementById('joystick-knob');
          var activePointerId = null;
          var maxRadius = 36;

          function updateJoy(clientX, clientY) {
            var rect = joyZone.getBoundingClientRect();
            var cx = rect.left + rect.width / 2;
            var cy = rect.top + rect.height / 2;
            var dx = clientX - cx;
            var dy = clientY - cy;
            var dist = Math.hypot(dx, dy);
            if (dist > maxRadius) {
              dx = (dx / dist) * maxRadius;
              dy = (dy / dist) * maxRadius;
            }
            joyKnob.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
            if (dist < 6) {
              g.joystickVec = { x: 0, y: 0 };
            } else {
              g.joystickVec = { x: dx / maxRadius, y: dy / maxRadius };
            }
          }

          function resetJoy() {
            activePointerId = null;
            joyKnob.style.transform = 'translate(0px, 0px)';
            g.joystickVec = { x: 0, y: 0 };
          }

          joyZone.addEventListener('pointerdown', function (e) {
            joyZone.setPointerCapture(e.pointerId);
            activePointerId = e.pointerId;
            updateJoy(e.clientX, e.clientY);
          });
          joyZone.addEventListener('pointermove', function (e) {
            if (activePointerId === e.pointerId) updateJoy(e.clientX, e.clientY);
          });
          joyZone.addEventListener('pointerup', function (e) {
            if (activePointerId === e.pointerId) resetJoy();
          });
          joyZone.addEventListener('pointercancel', resetJoy);

          // Keyboard Listeners
          function onKeyDown(e) {
            if (!appState.activeRole) return;
            var k = e.key.toLowerCase();
            g.keys[k] = true;
            if ((k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') && !isPaused()) {
              e.preventDefault();
            }
            if (e.repeat) return;
            if (k === 'q' || k === 'shift' || k === 'f') {
              toggleBow();
            } else if (k === ' ' || k === 'enter' || k === 'e') {
              if (g.dialogueModal) {
                var adv = g.dialogueModal.advancesQuest;
                g.dialogueModal = null;
                renderGameModalOverlay();
                if (adv) advanceQuestStep();
              } else {
                handleInteract();
              }
            } else if (k === 'x' || k === 'r') {
              triggerRudeAction();
            }
          }

          function onKeyUp(e) {
            g.keys[e.key.toLowerCase()] = false;
          }

          window.addEventListener('keydown', onKeyDown);
          window.addEventListener('keyup', onKeyUp);

          // Exposing modal callbacks via g._actions
          g._actions = {
            closeDialogue: function () {
              var adv = g.dialogueModal && g.dialogueModal.advancesQuest;
              g.dialogueModal = null;
              renderGameModalOverlay();
              if (adv) advanceQuestStep();
            },
            chooseQuiz: function (idx) {
              var q = GWAGEO_QUIZ[g.quizIndex];
              if (idx === q.correctIndex) {
                SoundEngine.playStepComplete();
                g.quizFeedback = { correct: true, text: '정답입니다! ' + q.explanation };
              } else {
                SoundEngine.playPenalty();
                g.quizFeedback = { correct: false, text: '아쉽습니다! 조선시대 신분 질서를 다시 떠올려 보세요.' };
              }
              renderGameModalOverlay();
            },
            nextQuiz: function () {
              if (g.quizIndex + 1 < GWAGEO_QUIZ.length) {
                g.quizIndex += 1;
                g.quizFeedback = null;
                renderGameModalOverlay();
              } else {
                g.quizModalOpen = false;
                renderGameModalOverlay();
                advanceQuestStep();
              }
            },
            respawn: respawnPlayer,
            exitToMenu: function () { document.getElementById('btn-exit-menu').click(); },
            closeNotebook: function () { g.showNotebook = false; renderGameModalOverlay(); },
            closeMinimap: function () { g.showMinimap = false; renderGameModalOverlay(); }
          };

          function tick(now) {
            if (!appState.activeRole) return;
            var dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            if (g.toastTimer > 0) {
              g.toastTimer -= dt;
              if (g.toastTimer <= 0) {
                g.toastMsg = null;
                syncGameHudDom();
              }
            }

            if (!isPaused()) {
              elapsedTotal += dt;
              var p = g.player;

              if (g.playerBubbleTimer > 0) {
                g.playerBubbleTimer -= dt;
                if (g.playerBubbleTimer <= 0) p.bubbleText = null;
              }
              if (p.rudeFlashTimer > 0) {
                p.rudeFlashTimer = Math.max(0, p.rudeFlashTimer - dt);
              }

              var ix = g.joystickVec.x;
              var iy = g.joystickVec.y;
              if (g.keys['arrowleft'] || g.keys['a']) ix -= 1;
              if (g.keys['arrowright'] || g.keys['d']) ix += 1;
              if (g.keys['arrowup'] || g.keys['w']) iy -= 1;
              if (g.keys['arrowdown'] || g.keys['s']) iy += 1;

              var mag = Math.hypot(ix, iy);
              if (mag > 1) { ix /= mag; iy /= mag; }

              var heavyPenalty = g.carryingItem && g.carryingItem.indexOf('쌀가마니') !== -1 ? 0.72 : 1;
              var bowFactor = p.isBowing ? 0 : 1;
              var speed = g.role.baseSpeed * heavyPenalty * bowFactor;

              p.vx = ix * speed;
              p.vy = iy * speed;

              if (Math.abs(p.vx) > 2 || Math.abs(p.vy) > 2) {
                p.walkTime += dt;
                if (Math.abs(p.vx) > Math.abs(p.vy)) {
                  p.facing = p.vx > 0 ? 'right' : 'left';
                } else {
                  p.facing = p.vy > 0 ? 'down' : 'up';
                }
              }

              var nextX = p.x + p.vx * dt;
              if (!isColliding(nextX, p.y, 14)) p.x = nextX;
              var nextY = p.y + p.vy * dt;
              if (!isColliding(p.x, nextY, 14)) p.y = nextY;

              // Royal Procession
              var royal = g.royal;
              if (royal.phase === 'IDLE') {
                royal.timer -= dt;
                if (royal.timer <= 0) {
                  royal.phase = 'WARNING';
                  royal.timer = 4.6;
                  royal.x = -160;
                  SoundEngine.playRoyalHorn();
                }
              } else if (royal.phase === 'WARNING') {
                royal.timer -= dt;
                if (royal.timer <= 0) {
                  royal.phase = 'PASSING';
                  royal.x = -140;
                }
              } else if (royal.phase === 'PASSING') {
                royal.x += 205 * dt;
                var hDist = Math.abs(p.x - royal.x);
                var onRoyalRoad = p.y >= ROYAL_ROAD_Y_MIN + 2 && p.y <= ROYAL_ROAD_Y_MAX - 2;
                var nearRoyalSight = Math.abs(p.y - royal.y) < 250 && hDist < 360;

                if (onRoyalRoad && hDist < 420) {
                  triggerFailure({
                    reasonTitle: '임금님 어가가 지나가는 큰길에서 비키지 않았습니다!',
                    historicalFeedback: '왕의 행차가 시작되면 양반을 포함한 모든 사람은 가운데 큰길 밖 가장자리로 물러나 예를 갖추어야 했어요.'
                  });
                } else if (nearRoyalSight && !p.isBowing) {
                  triggerFailure({
                    reasonTitle: '임금님 어가 행렬 앞에서 엎드려 절하지 않았습니다!',
                    historicalFeedback: '조선시대에 임금님은 나라에서 가장 높은 분이었어요. 어가가 지나갈 때는 길가에 물러나 공경하는 예를 보였습니다.'
                  });
                }

                if (royal.x > MAP_WIDTH + 180) {
                  royal.phase = 'IDLE';
                  royal.timer = 32;
                  g.reputation = Math.min(100, g.reputation + 10);
                  showToast('임금님 어가 행차를 예법대로 무사히 맞이했습니다! (+10 평판)');
                }
              }

              // Update NPCs
              var closestNpc = null;
              var closestDist = 88;
              for (var i = 0; i < g.npcs.length; i++) {
                var npc = g.npcs[i];
                if (npc.greetedTimer > 0) npc.greetedTimer = Math.max(0, npc.greetedTimer - dt);
                if (npc.bubbleTimer > 0) {
                  npc.bubbleTimer -= dt;
                  if (npc.bubbleTimer <= 0) npc.bubbleText = null;
                }

                var dPlayer = Math.hypot(npc.currentX - p.x, npc.currentY - p.y);
                if (dPlayer < closestDist) {
                  closestDist = dPlayer;
                  closestNpc = npc;
                }

                // Royal etiquette across entire village
                var onHazard = npc.currentY >= ROYAL_ROAD_Y_MIN - 24 && npc.currentY <= ROYAL_ROAD_Y_MAX + 24;
                if (royal.phase === 'IDLE') {
                  npc.royalPosture = null;
                  npc.royalBubbleShown = false;
                } else {
                  npc.isBowingToPlayer = false;
                  if (onHazard) {
                    var stepDir = npc.currentY < royal.y ? -1 : 1;
                    npc.vx = 0;
                    npc.vy = stepDir * 140;
                    npc.currentY += npc.vy * dt;
                    npc.royalPosture = null;
                  } else {
                    npc.vx = 0;
                    npc.vy = 0;
                    if (royal.phase === 'PASSING' || (royal.phase === 'WARNING' && royal.timer < 2.3)) {
                      npc.royalPosture = npc.royalEtiquette;
                    }
                    if (royal.phase === 'PASSING' && !npc.royalBubbleShown && Math.abs(npc.currentX - royal.x) < 420) {
                      npc.royalBubbleShown = true;
                      npc.bubbleTimer = 3.2;
                      if (npc.royalEtiquette === 'gukgung') {
                        npc.bubbleText = '서서 허리를 숙여 국궁(鞠躬)하옵니다!';
                      } else if (npc.royalEtiquette === 'eup') {
                        npc.bubbleText = '종친으로서 가볍게 읍(揖)을 올리옵니다';
                      } else if (npc.rank >= 2) {
                        npc.bubbleText = '길가에 엎드려 예를 올립니다!';
                      } else {
                        npc.bubbleText = '용안을 뵐 수 없으니 엎드리자!';
                      }
                    }
                  }
                }

                if (royal.phase === 'IDLE' && npc.patrolPoints && npc.patrolPoints.length > 1 && !npc.isBowingToPlayer) {
                  var pt = npc.patrolPoints[npc.patrolIndex];
                  var dx = pt.x - npc.currentX;
                  var dy = pt.y - npc.currentY;
                  var dist = Math.hypot(dx, dy);
                  var spd = npc.speed || 65;
                  if (dist < 6) {
                    npc.patrolIndex = (npc.patrolIndex + 1) % npc.patrolPoints.length;
                    npc.vx = 0; npc.vy = 0;
                  } else {
                    npc.vx = (dx / dist) * spd;
                    npc.vy = (dy / dist) * spd;
                    npc.currentX += npc.vx * dt;
                    npc.currentY += npc.vy * dt;
                  }
                } else if (royal.phase === 'IDLE') {
                  npc.vx = 0; npc.vy = 0;
                }

                if (royal.phase === 'IDLE' && g.role.rank >= 2 && npc.rank < g.role.rank) {
                  if (dPlayer < 115) {
                    npc.isBowingToPlayer = true;
                    if (npc.greetedTimer <= 0) {
                      npc.greetedTimer = 9;
                      npc.bubbleText = npc.lowerRankReply;
                      npc.bubbleTimer = 2.6;
                    }
                  } else {
                    npc.isBowingToPlayer = false;
                  }
                }

                if (royal.phase === 'IDLE' && mustBowToNpc(g.role.rank, npc.rank) && npc.greetedTimer <= 0) {
                  if (dPlayer < 27 && !p.isBowing) {
                    triggerFailure({
                      reasonTitle: '길에서 윗 신분(' + npc.name + ' · ' + npc.roleTitle + ')과 부딪혔습니다!',
                      historicalFeedback: '조선시대에는 ' + g.role.rankLabel + '이(가) 자신보다 높은 ' + npc.roleTitle + '의 앞길을 가로막거나 부딪히는 것을 큰 결례로 여겨 엄하게 벌했습니다.'
                    });
                    break;
                  }
                  if (dPlayer < 105) {
                    if (p.isBowing) {
                      npc.greetedTimer = 9.5;
                      npc.approachWarningTimer = 0;
                      npc.bubbleText = npc.higherRankReply;
                      npc.bubbleTimer = 2.8;
                      SoundEngine.playBow();
                      g.reputation = Math.min(100, g.reputation + 2);
                    } else {
                      npc.approachWarningTimer += dt;
                      if (!npc.bubbleText) {
                        npc.bubbleText = '예절(Q)을 갖추어 인사하거라!';
                        npc.bubbleTimer = 1.2;
                      }
                      if (npc.approachWarningTimer >= 2.5) {
                        triggerFailure({
                          reasonTitle: npc.name + '(' + npc.roleTitle + ') 앞에서 고개 숙여 인사하지 않았습니다!',
                          historicalFeedback: '조선시대에는 길에서 윗 신분을 만나면 걸음을 멈추고 공손히 인사해야 했어요. 인사를 하지 않으면 신분 질서를 어긴 불경죄로 처벌받았습니다.'
                        });
                        break;
                      }
                    }
                  } else if (npc.approachWarningTimer > 0.45 && dPlayer >= 112) {
                    triggerFailure({
                      reasonTitle: npc.name + '(' + npc.roleTitle + ')께 인사를 생략하고 지나갔습니다!',
                      historicalFeedback: g.role.rankLabel + '은(는) 자신보다 높은 ' + npc.roleTitle + '을(를) 마주치면 반드시 멈춰 서서 인사를 드린 뒤에 지나가야 했어요.'
                    });
                    break;
                  } else {
                    npc.approachWarningTimer = 0;
                  }
                }
              }

              g.nearbyNpc = closestNpc;
              uiAccum += dt;
              if (uiAccum >= 0.1) {
                uiAccum = 0;
                syncGameHudDom();
              }
            }

            var activeStep = g.role.steps[g.stepIndex];
            var camX = Math.max(0, Math.min(MAP_WIDTH - VIEW_W, g.player.x - VIEW_W / 2));
            var camY = Math.max(0, Math.min(MAP_HEIGHT - VIEW_H, g.player.y - VIEW_H / 2));
            renderJoseonWorld(ctx, {
              player: g.player,
              npcs: g.npcs,
              royal: g.royal,
              targetNpcId: activeStep ? activeStep.targetNpcId : null,
              timeSec: elapsedTotal,
              cameraX: camX,
              cameraY: camY
            });

            animFrameId = requestAnimationFrame(tick);
          }

          animFrameId = requestAnimationFrame(tick);
        }

        function syncGameHudDom() {
          var g = appState.game;
          if (!g) return;
          var repFill = document.getElementById('rep-fill');
          var repText = document.getElementById('rep-text');
          if (repFill && repText) {
            repFill.style.width = g.reputation + '%';
            repFill.style.backgroundColor = g.reputation >= 60 ? '#2F6B48' : '#C23B2B';
            repText.textContent = g.reputation + '/100';
          }

          var carryEl = document.getElementById('hud-carry');
          if (carryEl) {
            if (g.carryingItem) {
              carryEl.classList.remove('hidden');
              carryEl.textContent = '· 소지품: ' + g.carryingItem;
            } else {
              carryEl.classList.add('hidden');
            }
          }

          var nbEl = document.getElementById('notebook-count');
          if (nbEl) nbEl.textContent = '역사 노트 (' + g.discoveredTips.length + ')';

          var muteBtn = document.getElementById('btn-toggle-mute');
          if (muteBtn) muteBtn.innerHTML = SoundEngine.muted ? ICONS.volOff : ICONS.volOn;

          var step = g.role.steps[g.stepIndex];
          if (step) {
            var npcObj = NPCS.find(function (n) { return n.id === step.targetNpcId; });
            document.getElementById('quest-step-num').textContent = '미션 ' + (g.stepIndex + 1) + ' / ' + g.role.steps.length;
            document.getElementById('quest-location').textContent = '목표 위치: ' + (npcObj ? npcObj.locationZone + ' · ' + npcObj.name : '');
            document.getElementById('quest-title').textContent = step.title;
            document.getElementById('quest-hint').textContent = step.targetHint;
          }

          var royalAlert = document.getElementById('royal-alert');
          var royalAlertText = document.getElementById('royal-alert-text');
          var royalBowBtn = document.getElementById('btn-royal-bow');
          if (royalAlert) {
            if (g.royal.phase === 'IDLE') {
              royalAlert.classList.add('hidden');
            } else {
              royalAlert.classList.remove('hidden');
              royalAlertText.textContent = g.royal.phase === 'WARNING'
                ? '임금님의 어가가 곧 행차합니다! (' + Math.max(0, Math.ceil(g.royal.timer)) + '초) 가운데 큰길 밖으로 비키세요!'
                : '어가 행차 중! 길 밖에서 [예절(엎드려 절)] 상태를 유지하세요!';
              royalBowBtn.textContent = g.player.isBowing ? '엎드리는 중' : '지금 엎드리기';
            }
          }

          var toastEl = document.getElementById('toast-banner');
          if (toastEl) {
            if (g.toastMsg) {
              toastEl.classList.remove('hidden');
              toastEl.textContent = g.toastMsg;
            } else {
              toastEl.classList.add('hidden');
            }
          }

          var promptEl = document.getElementById('talk-prompt');
          var talkBtn = document.getElementById('btn-action-talk');
          if (promptEl && talkBtn) {
            if (g.nearbyNpc && !g.dialogueModal) {
              promptEl.classList.remove('hidden');
              promptEl.textContent = g.nearbyNpc.name + ' (' + g.nearbyNpc.roleTitle + ') · [Space] 대화하기';
              talkBtn.disabled = false;
            } else {
              promptEl.classList.add('hidden');
              talkBtn.disabled = !g.nearbyNpc;
            }
          }

          var bowBtn = document.getElementById('btn-action-bow');
          var bowLabel = document.getElementById('bow-label');
          var bowSub = document.getElementById('bow-sub');
          if (bowBtn && bowLabel && bowSub) {
            if (g.player.isBowing) {
              bowBtn.classList.add('active');
              bowLabel.textContent = '예절 유지 중';
              bowSub.textContent = '다시 누르면 일어남';
            } else {
              bowBtn.classList.remove('active');
              bowLabel.textContent = '예절 · 절하기';
              bowSub.textContent = 'Q / Shift';
            }
          }
        }

              '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
                '<div class="hanji-card modal-card" style="max-width:460px;text-align:center;">' +
                  '<div style="width:54px;height:54px;margin:0 auto 12px;border-radius:999px;background:#F9E5E3;border:1px solid rgba(194,59,43,0.4);display:flex;align-items:center;justify-content:center;color:#C23B2B;">' + ICONS.alert + '</div>' +
                  '<h2 class="font-serif-kr" style="font-size:22px;font-weight:700;color:#C23B2B;">불경죄로 관아에 끌려갔습니다!</h2>' +
                  '<p style="margin-top:8px;font-size:14px;font-weight:700;">' + escapeHtml(f.reasonTitle) + '</p>' +
                  '<div class="info-box" style="margin-top:14px;text-align:left;"><strong style="color:#7C5438;display:block;margin-bottom:4px;">왜 실패했을까요?</strong>' + escapeHtml(f.historicalFeedback) + '</div>' +
                  '<div style="margin-top:20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;">' +
                    '<button id="btn-fail-menu" class="btn-secondary">신분 도감</button>' +
                    '<button id="btn-fail-respawn" class="btn-primary" style="background-color:#C23B2B;">' + ICONS.reset + ' 시작 지점에서 다시 도전하기</button>' +
                  '</div>' +
                '</div>' +
              '</div>';
            document.getElementById('btn-fail-menu').onclick = g._actions.exitToMenu;
            document.getElementById('btn-fail-respawn').onclick = g._actions.respawn;
            return;
          }

          if (g.missionCleared) {
            var r = g.role;
            root.innerHTML =
              '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
                '<div class="hanji-card modal-card">' +
                  '<div class="modal-header">' +
                    '<div style="display:flex;align-items:center;gap:12px;">' +
                      portraitSvg(r.id, 62) +
                      '<div><p style="font-size:12.5px;font-weight:700;color:#2F6B48;">' + escapeHtml(r.rankLabel) + ' 체험 완료</p><h2 class="font-serif-kr" style="font-size:21px;font-weight:700;">' + escapeHtml(r.characterName) + '의 하루를 완수했어요!</h2></div>' +
                    '</div>' +
                    stampSvg('완수', 54) +
                  '</div>' +
                  '<div style="margin-top:16px;display:flex;flex-direction:column;gap:10px;">' +
                    '<div class="info-box"><strong style="color:#1E4D7B;display:block;margin-bottom:2px;">권리와 혜택</strong>' + escapeHtml(r.summaryPoints.privilege) + '</div>' +
                    '<div class="info-box"><strong style="color:#C88A1E;display:block;margin-bottom:2px;">의무와 책임</strong>' + escapeHtml(r.summaryPoints.duty) + '</div>' +
                    '<div class="info-box"><strong style="color:#2F6B48;display:block;margin-bottom:2px;">생활 모습</strong>' + escapeHtml(r.summaryPoints.dailyLife) + '</div>' +
                  '</div>' +
                  '<div style="margin-top:20px;text-align:right;"><button id="btn-clear-next" class="btn-primary">다른 신분 선택하기</button></div>' +
                '</div>' +
              '</div>';
            document.getElementById('btn-clear-next').onclick = g._actions.exitToMenu;
            return;
          }

          if (g.showNotebook) {
            var tipsHtml = g.discoveredTips.length === 0
              ? '<p style="text-align:center;color:#594F46;padding:28px 0;font-size:14px;">아직 기록된 역사 이야기가 없어요. 마을 사람들에게 가까이 다가가 Space(대화)를 눌러 보세요!</p>'
              : g.discoveredTips.map(function (t) {
                  return '<div class="info-box"><strong style="color:#1E4D7B;display:block;margin-bottom:4px;">' + escapeHtml(t.npcName) + ' · ' + escapeHtml(t.roleTitle) + '</strong>' + escapeHtml(t.tip) + '</div>';
                }).join('');
            root.innerHTML =
              '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
                '<div class="hanji-card modal-card" style="max-height:84vh;display:flex;flex-direction:column;">' +
                  '<button class="modal-close" id="btn-close-notebook" aria-label="닫기">' + ICONS.close + '</button>' +
                  '<h2 class="font-serif-kr" style="font-size:20px;font-weight:700;margin-bottom:12px;">마을 역사 노트 (' + g.discoveredTips.length + ' / ' + NPCS.length + ')</h2>' +
                  '<div style="overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px;">' + tipsHtml + '</div>' +
                '</div>' +
              '</div>';
            document.getElementById('btn-close-notebook').onclick = g._actions.closeNotebook;
            return;
          }

          if (g.showMinimap) {
            root.innerHTML =
              '<div class="modal-backdrop" role="dialog" aria-modal="true">' +
                '<div class="hanji-card modal-card">' +
                  '<button class="modal-close" id="btn-close-map" aria-label="닫기">' + ICONS.close + '</button>' +
                  '<h2 class="font-serif-kr" style="font-size:20px;font-weight:700;">한양 아랫마을 지도</h2>' +
                  '<div class="map-grid">' +
                    '<div class="map-zone" style="background:#E9EFF5;"><strong style="color:#1E4D7B;display:block;">북서쪽 (왼쪽 위)</strong>김 대감 댁(양반가), 청학 서당</div>' +
                    '<div class="map-zone" style="background:#F6EEDB;"><strong style="color:#9A6B26;display:block;">북동쪽 (오른쪽 위)</strong>한양 관아 (조 사또, 박 아전)</div>' +
                    '<div class="map-zone" style="grid-column:span 2;background:#F9E6E4;text-align:center;"><strong style="color:#C23B2B;">가운데 가로 큰길:</strong> 임금님 어가 행차로 (대동로)</div>' +
                    '<div class="map-zone" style="background:#E7EFE9;"><strong style="color:#2F6B48;display:block;">남서쪽 (왼쪽 아래)</strong>덕배네 초가집, 논밭, 무쇠 대장간</div>' +
                    '<div class="map-zone" style="background:#F5EAE1;"><strong style="color:#7C5438;display:block;">남동쪽 (오른쪽 아래)</strong>저잣거리 (비단 가게, 약재방, 싸전)</div>' +
                  '</div>' +
                  '<div style="margin-top:16px;text-align:right;"><button id="btn-ok-map" class="btn-primary">확인</button></div>' +
                '</div>' +
              '</div>';
            document.getElementById('btn-close-map').onclick = g._actions.closeMinimap;
            document.getElementById('btn-ok-map').onclick = g._actions.closeMinimap;
            return;
          }

          root.innerHTML = '';
        }

        // Initial Boot
        renderMenuScreen();
      })();
    </script>
  </body>
</html>
