<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>조선 신분 체험기: 한양 마을의 하루</title>
    <meta name="description" content="초등학교 5학년 사회 과목 '조선시대의 신분 질서와 생활 모습'을 체험하는 2D 탑다운 교육용 미니 RPG" />
    <meta property="og:title" content="조선 신분 체험기: 한양 마을의 하루" />
    <meta property="og:description" content="양반, 중인, 상민, 천민이 되어 조선시대 신분 질서와 생활 모습을 직접 체험해 보세요." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --hanji-bg: #f6f0e2;
        --hanji-card: #fcf9f2;
        --hanji-surface-alt: #f3ebd8;
        --hanji-border: #d7cab2;
        --hanji-divider: #e4d9c4;
        --ink-primary: #241f1c;
        --ink-secondary: #594f46;
        --obang-blue: #1e4d7b;
        --obang-red: #c23b2b;
        --obang-yellow: #c88a1e;
        --pine-green: #2f6b48;
        --clay-brown: #7c5438;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--hanji-bg);
        color: var(--ink-primary);
        font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', -apple-system, BlinkMacSystemFont, sans-serif;
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      h1, h2, h3, .font-serif-kr {
        font-family: 'Gowun Batang', 'Batang', Georgia, serif;
        margin: 0;
      }

      p, dl, dd, dt, ul {
        margin: 0;
      }

      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        color: inherit;
      }

      button:focus-visible {
        outline: 2px solid var(--obang-blue);
        outline-offset: 2px;
      }

      .hanji-surface {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--hanji-bg);
        background-image:
          radial-gradient(rgba(120, 95, 65, 0.045) 1px, transparent 0),
          radial-gradient(rgba(160, 130, 95, 0.04) 1px, transparent 0);
        background-size: 28px 28px;
        background-position: 0 0, 14px 14px;
      }

      .hanji-card {
        background-color: var(--hanji-card);
        border: 1px solid var(--hanji-border);
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(45, 34, 22, 0.06);
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .hidden {
        display: none !important;
      }

      /* Top Header */
      .topbar {
        border-bottom: 1px solid var(--hanji-border);
        background: rgba(250, 246, 236, 0.94);
        backdrop-filter: blur(4px);
      }

      .topbar-inner {
        max-width: 1152px;
        margin: 0 auto;
        padding: 0 20px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .brand-title {
        font-family: 'Gowun Batang', 'Batang', serif;
        font-size: 20px;
        font-weight: 700;
        color: var(--ink-primary);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .nav-link-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-secondary);
        padding: 6px 2px;
        white-space: nowrap;
        transition: color 0.15s ease;
      }

      .nav-link-btn:hover {
        color: var(--ink-primary);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 700;
        color: #ffffff;
        background-color: var(--obang-blue);
        white-space: nowrap;
        transition: opacity 0.15s ease, background-color 0.15s ease;
      }

      .btn-primary:hover {
        opacity: 0.92;
      }

      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-secondary);
        border: 1px solid var(--hanji-border);
        background-color: transparent;
        white-space: nowrap;
        transition: background-color 0.15s ease;
      }

      .btn-secondary:hover {
        background-color: #efe7d6;
      }

      /* Role Select Page */
      .menu-main {
        flex: 1;
        max-width: 1152px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 20px 44px;
      }

      .hero-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--hanji-border);
        padding-bottom: 24px;
        margin-bottom: 28px;
      }

      .hero-kicker {
        font-size: 14px;
        font-weight: 600;
        color: var(--obang-blue);
        margin-bottom: 6px;
      }

      .hero-title {
        font-size: clamp(26px, 3.2vw, 36px);
        font-weight: 700;
        line-height: 1.25;
        color: var(--ink-primary);
        text-wrap: balance;
      }

      .hero-desc {
        margin-top: 10px;
        font-size: 15px;
        color: var(--ink-secondary);
        max-width: 660px;
        line-height: 1.6;
      }

      .hero-controls-note {
        font-size: 13px;
        color: var(--ink-secondary);
        text-align: right;
      }

      .hero-controls-note strong {
        display: block;
        color: var(--ink-primary);
        font-weight: 600;
        margin-top: 2px;
      }

      .role-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }

      .role-card {
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: transform 0.16s ease;
      }

      .role-card:hover {
        transform: translateY(-2px);
      }

      .stamp-corner {
        position: absolute;
        top: 16px;
        right: 16px;
        transform: rotate(-10deg);
        pointer-events: none;
      }

      .role-meta-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-secondary);
        margin-bottom: 12px;
        padding-right: 58px;
      }

      .role-header-row {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }

      .role-name {
        font-size: 22px;
        font-weight: 700;
        color: var(--ink-primary);
        padding-right: 40px;
      }

      .role-sub {
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-secondary);
        margin-top: 3px;
      }

      .role-details {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--hanji-divider);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 14px;
      }

      .role-detail-row {
        display: flex;
        gap: 10px;
      }

      .role-detail-row dt {
        width: 48px;
        flex-shrink: 0;
        font-weight: 700;
        color: var(--ink-primary);
      }

      .role-detail-row dd {
        color: #4a423b;
        line-height: 1.45;
      }

      .role-card-footer {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--hanji-divider);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .role-status-text {
        font-size: 12.5px;
        color: var(--ink-secondary);
      }

      /* Game HUD & Stage */
      .game-hud {
        border-bottom: 1px solid var(--hanji-border);
        background: rgba(250, 246, 236, 0.96);
        padding: 10px 16px;
      }

      .game-hud-inner {
        max-width: 1152px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .hud-left, .hud-center, .hud-right {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .reputation-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .reputation-track {
        width: 96px;
        height: 10px;
        border-radius: 999px;
        background: #e4d9c4;
        border: 1px solid #cbbfa8;
        overflow: hidden;
      }

      .reputation-fill {
        height: 100%;
        background-color: var(--pine-green);
        transition: width 0.2s ease, background-color 0.2s ease;
      }

      .game-main {
        flex: 1;
        max-width: 1152px;
        width: 100%;
        margin: 0 auto;
        padding: 12px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .quest-strip {
        padding: 10px 16px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .quest-strip-left {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
      }

      .quest-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-secondary);
      }

      .quest-title {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-primary);
      }

      .quest-hint {
        font-size: 12.5px;
        color: var(--ink-secondary);
      }

      .royal-alert {
        border-radius: 10px;
        padding: 10px 16px;
        background-color: var(--obang-red);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        box-shadow: 0 4px 12px rgba(194, 59, 43, 0.25);
        font-size: 13.5px;
        font-weight: 700;
      }

      .royal-alert-btn {
        padding: 6px 12px;
        border-radius: 6px;
        background: #ffffff;
        color: var(--obang-red);
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
      }

      .canvas-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 960 / 580;
        border-radius: 12px;
        overflow: hidden;
        border: 2px solid #8d7b64;
        background-color: #d9dfbf;
        box-shadow: 0 8px 24px rgba(36, 31, 28, 0.14);
      }

      #game-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .toast-banner {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 16px;
        border-radius: 8px;
        background: rgba(36, 31, 28, 0.9);
        color: #faf6ec;
        font-size: 13px;
        font-weight: 500;
        pointer-events: none;
        white-space: nowrap;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .talk-prompt {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(252, 249, 242, 0.95);
        border: 1px solid var(--obang-yellow);
        font-size: 12px;
        font-weight: 700;
        color: var(--ink-primary);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      /* Touch Joystick & Action Buttons */
      .joystick-zone {
        position: absolute;
        bottom: 12px;
        left: 12px;
        width: 112px;
        height: 112px;
        border-radius: 999px;
        border: 2px solid rgba(122, 104, 82, 0.6);
        background: rgba(250, 246, 236, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      }

      .joystick-ring {
        position: absolute;
        inset: 8px;
        border-radius: 999px;
        border: 1px dashed rgba(166, 148, 122, 0.55);
        pointer-events: none;
      }

      .joystick-knob {
        width: 46px;
        height: 46px;
        border-radius: 999px;
        background: rgba(36, 31, 28, 0.85);
        border: 2px solid #fdfbf6;
        pointer-events: none;
        transition: transform 0.06s linear;
      }

      .action-pad {
        position: absolute;
        bottom: 12px;
        right: 12px;
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .action-btn {
        min-height: 54px;
        padding: 6px 14px;
        border-radius: 12px;
        font-size: 12.5px;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
        white-space: nowrap;
        transition: background-color 0.15s ease, opacity 0.15s ease;
      }

      .action-btn small {
        font-size: 10px;
        font-weight: 400;
        opacity: 0.85;
      }

      .btn-rude {
        min-height: 44px;
        padding: 6px 11px;
        background: rgba(252, 249, 242, 0.92);
        color: #9e2e24;
        border: 1px solid rgba(194, 59, 43, 0.5);
      }

      .btn-rude:hover {
        background: #f5e1df;
      }

      .btn-bow {
        background: rgba(252, 249, 242, 0.95);
        color: var(--obang-blue);
        border: 1px solid rgba(30, 77, 123, 0.5);
      }

      .btn-bow.active {
        background: var(--pine-green);
        color: #ffffff;
        border-color: #1e4a30;
      }

      .btn-talk {
        background: var(--obang-yellow);
        color: #ffffff;
        border: 1px solid #8e5f0e;
      }

      .btn-talk:disabled {
        background: rgba(229, 222, 201, 0.85);
        color: #8a7f6e;
        border-color: #cbbfa8;
        cursor: not-allowed;
      }

      .controls-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
        color: var(--ink-secondary);
        padding: 0 4px;
      }

      /* Modals */
      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(0, 0, 0, 0.52);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow-y: auto;
      }

      .modal-card {
        width: 100%;
        max-width: 560px;
        padding: 24px;
        position: relative;
        margin: auto;
      }

      .modal-card.wide {
        max-width: 760px;
      }

      .modal-close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-secondary);
      }

      .modal-close:hover {
        background: #efe7d6;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--hanji-border);
      }

      .info-box {
        border-radius: 8px;
        background: var(--hanji-surface-alt);
        border: 1px solid var(--hanji-border);
        padding: 14px;
        font-size: 13.5px;
        color: #3d352e;
        line-height: 1.6;
      }

      .quiz-choice {
        width: 100%;
        text-align: left;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--hanji-border);
        background: #faf6ec;
        font-size: 14px;
        font-weight: 500;
        color: var(--ink-primary);
        transition: background-color 0.15s ease;
      }

      .quiz-choice:hover:not(:disabled) {
        background: #efe6d2;
      }

      .quiz-feedback {
        margin-top: 14px;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13.5px;
        border: 1px solid;
      }

      .quiz-feedback.ok {
        background: #e9f3ec;
        border-color: rgba(47, 107, 72, 0.45);
        color: #1f4a31;
      }

      .quiz-feedback.err {
        background: #f9e8e6;
        border-color: rgba(194, 59, 43, 0.45);
        color: #8b2318;
      }

      .comparison-table-wrap {
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid var(--hanji-border);
      }

      table.comparison-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        text-align: left;
      }

      table.comparison-table th {
        background: #efe6d2;
        padding: 10px 12px;
        border-bottom: 1px solid var(--hanji-border);
        font-weight: 700;
        white-space: nowrap;
      }

      table.comparison-table td {
        padding: 10px 12px;
        border-top: 1px solid var(--hanji-divider);
        color: #4a423b;
        vertical-align: top;
      }

      .map-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .map-zone {
        border-radius: 8px;
        padding: 12px;
        font-size: 13px;
        border: 1px solid var(--hanji-border);
      }

      @media (max-width: 768px) {
        .role-grid {
          grid-template-columns: 1fr;
        }
        .hero-controls-note {
          text-align: left;
        }
        .topbar-inner {
          gap: 12px;
        }
        .nav-links {
          gap: 12px;
        }
        .talk-prompt {
          display: none;
        }
        .joystick-zone {
          width: 96px;
          height: 96px;
          bottom: 8px;
          left: 8px;
        }
        .joystick-knob {
          width: 40px;
          height: 40px;
        }
        .action-pad {
          bottom: 8px;
          right: 8px;
          gap: 6px;
        }
        .action-btn {
          min-height: 46px;
          padding: 5px 10px;
          font-size: 11.5px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      (function () {
        'use strict';

        // -------------------------------------------------------------------
        // 1. CONSTANTS & EDUCATIONAL DATA
        // -------------------------------------------------------------------
        var MAP_WIDTH = 1600;
        var MAP_HEIGHT = 1120;
        var VIEW_W = 960;
        var VIEW_H = 580;
        var ROYAL_ROAD_Y_MIN = 475;
        var ROYAL_ROAD_Y_MAX = 595;
        var STREAM_X_MIN = 795;
        var STREAM_X_MAX = 855;
        var STORAGE_KEY = 'joseon_status_rpg_cleared_v1';

        var BRIDGES = [
          { x: 785, y: 285, w: 80, h: 105 },
          { x: 785, y: 470, w: 80, h: 130 },
          { x: 785, y: 785, w: 80, h: 110 }
        ];

        function mustBowToNpc(playerRank, npcRank) {
          // 상민·천민은 양반(3)과 중인(2)에게만 인사하며, 천민은 상민(1)에게 인사할 필요 없음
          return npcRank > playerRank && npcRank >= 2;
        }

        var ROLES = [
          {
            id: 'yangban',
            rank: 3,
            rankLabel: '양반',
            characterName: '선비 이도령',
            title: '학문과 예법을 지키는 사대부',
            stars: 1,
            difficultyText: '쉬움',
            accentHex: '#1E4D7B',
            clothesDesc: '검은 갓과 푸른 도포를 단정히 차려입고 위엄 있게 걷습니다.',
            roleDesc: '과거 시험을 보아 벼슬에 오를 수 있으며, 아랫신분에게 인사를 받습니다.',
            summaryPoints: {
              privilege: '과거 시험 응시 자격이 있고 세금과 군역을 면제받았습니다.',
              duty: '유교적 예법과 학문을 닦고 백성을 다스리는 책임을 졌습니다.',
              dailyLife: '기와집에 살며 서당에서 공부했지만, 임금님의 행차 앞에서는 반드시 엎드려야 했습니다.'

        function stampSvg(label, size) {

            '</svg>';

        // -------------------------------------------------------------------
        // 4. CANVAS 2D RENDERER
        // -------------------------------------------------------------------
        function drawRoundedRect(ctx, x, y, w, h, r) {
          var radius = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + radius, y);
          ctx.lineTo(x + w - radius, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
          ctx.lineTo(x + w, y + h - radius);
          ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
          ctx.lineTo(x + radius, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
          ctx.lineTo(x, y + radius);
          ctx.quadraticCurveTo(x, y, x + radius, y);
          ctx.closePath();
        }

        function drawTerrain(ctx, timeSec, royal) {
          ctx.fillStyle = '#D9DFBF';
          ctx.fillRect(0, 0, MAP_WIDTH, MAP_HEIGHT);

          ctx.fillStyle = '#CFD7B1';
          for (var gx = 40; gx < MAP_WIDTH; gx += 130) {
            for (var gy = 40; gy < MAP_HEIGHT; gy += 120) {
              if ((gx + gy) % 260 === 0) {
                ctx.beginPath();
                ctx.ellipse(gx, gy, 42, 22, 0.2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }

          // Rice paddies
          ctx.fillStyle = '#C7BC7A';
          drawRoundedRect(ctx, 70, 910, 315, 145, 10);
          ctx.fill();
          ctx.strokeStyle = '#9C8D58';
          ctx.lineWidth = 3;
          ctx.stroke();

          for (var row = 0; row < 2; row++) {
            for (var col = 0; col < 3; col++) {
              var px = 82 + col * 100;
              var py = 922 + row * 64;
              ctx.fillStyle = (row + col) % 2 === 0 ? '#AEB964' : '#B9C46F';
              ctx.fillRect(px, py, 90, 54);
              ctx.strokeStyle = '#8F824D';
              ctx.lineWidth = 1.5;
              ctx.strokeRect(px, py, 90, 54);

              ctx.fillStyle = '#D9AE3B';
              for (var sx = px + 12; sx < px + 84; sx += 18) {
                for (var sy = py + 14; sy < py + 48; sy += 16) {
                  ctx.fillRect(sx, sy, 4, 6);
                }
              }
            }
          }
          ctx.fillStyle = '#53452A';
          ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('풍년 논밭', 228, 1074);

          // Village dirt paths
          ctx.fillStyle = '#E5D3B3';
          ctx.fillRect(130, 305, 665, 85);
          ctx.fillRect(855, 310, 560, 80);
          ctx.fillRect(220, 385, 70, 95);
          ctx.fillRect(545, 385, 70, 95);
          ctx.fillRect(210, 595, 75, 290);
          ctx.fillRect(525, 595, 75, 290);
          ctx.fillRect(210, 825, 580, 68);
          ctx.fillRect(905, 385, 70, 520);
          ctx.fillRect(1160, 385, 75, 95);
          ctx.fillRect(1030, 595, 310, 80);
          ctx.fillRect(1030, 815, 320, 80);

          // Royal Avenue
          ctx.fillStyle = '#DEC499';
          ctx.fillRect(0, ROYAL_ROAD_Y_MIN, MAP_WIDTH, ROYAL_ROAD_Y_MAX - ROYAL_ROAD_Y_MIN);

          ctx.fillStyle = '#C7B89E';
          ctx.fillRect(0, ROYAL_ROAD_Y_MIN - 14, MAP_WIDTH, 14);
          ctx.fillRect(0, ROYAL_ROAD_Y_MAX, MAP_WIDTH, 14);
          ctx.strokeStyle = '#9D8E75';
          ctx.lineWidth = 1.5;
          for (var curbx = 0; curbx < MAP_WIDTH; curbx += 40) {
            ctx.strokeRect(curbx, ROYAL_ROAD_Y_MIN - 14, 40, 14);
            ctx.strokeRect(curbx, ROYAL_ROAD_Y_MAX, 40, 14);
          }

          if (royal.phase !== 'IDLE') {
            var pulse = 0.16 + 0.1 * Math.sin(timeSec * 8);
            ctx.fillStyle = 'rgba(194, 59, 43, ' + pulse + ')';
            ctx.fillRect(0, ROYAL_ROAD_Y_MIN, MAP_WIDTH, ROYAL_ROAD_Y_MAX - ROYAL_ROAD_Y_MIN);

            ctx.save();
            ctx.fillStyle = 'rgba(150, 28, 18, 0.8)';
            ctx.font = 'bold 16px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            for (var tx = 220; tx < MAP_WIDTH; tx += 420) {
              ctx.fillText('▲ 어가 행차로 — 길 밖으로 비켜 예를 갖추세요 ▲', tx, (ROYAL_ROAD_Y_MIN + ROYAL_ROAD_Y_MAX) / 2 + 6);
            }
            ctx.restore();
          } else {
            ctx.fillStyle = 'rgba(110, 86, 52, 0.55)';
            ctx.font = 'bold 13px "Noto Sans KR", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('임금님 행차 큰길 (대동로)', 420, ROYAL_ROAD_Y_MIN + 22);
            ctx.fillText('임금님 행차 큰길 (대동로)', 1220, ROYAL_ROAD_Y_MIN + 22);
          }

          // Stream
          ctx.fillStyle = '#6FA8B8';
          ctx.fillRect(STREAM_X_MIN, 0, STREAM_X_MAX - STREAM_X_MIN, MAP_HEIGHT);
          ctx.fillStyle = '#B8AD92';
          ctx.fillRect(STREAM_X_MIN - 6, 0, 6, MAP_HEIGHT);
          ctx.fillRect(STREAM_X_MAX, 0, 6, MAP_HEIGHT);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 2;
          for (var wy = ((timeSec * 28) % 60) - 30; wy < MAP_HEIGHT; wy += 60) {
            ctx.beginPath();
            ctx.moveTo(STREAM_X_MIN + 14, wy);
            ctx.quadraticCurveTo(STREAM_X_MIN + 30, wy + 8, STREAM_X_MIN + 46, wy);
            ctx.stroke();
          }

          // Bridges
          for (var bi = 0; bi < BRIDGES.length; bi++) {
            var b = BRIDGES[bi];
            ctx.fillStyle = '#9C7046';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#6B492A';
            ctx.lineWidth = 2;
            for (var py = b.y + 8; py < b.y + b.h; py += 14) {
              ctx.beginPath();
              ctx.moveTo(b.x, py);
              ctx.lineTo(b.x + b.w, py);
              ctx.stroke();
            }
            ctx.fillStyle = '#5C3D21';
            ctx.fillRect(b.x - 2, b.y - 4, b.w + 4, 7);
            ctx.fillRect(b.x - 2, b.y + b.h - 3, b.w + 4, 7);
          }
        }

        function drawStoneWalls(ctx) {
          for (var i = 0; i < STONE_WALLS.length; i++) {
            var w = STONE_WALLS[i];
            ctx.fillStyle = '#B9AE9A';
            ctx.fillRect(w.x, w.y, w.w, w.h);
            ctx.strokeStyle = '#7E7463';
            ctx.lineWidth = 1.5;
            for (var sx = w.x; sx < w.x + w.w; sx += 18) {
              ctx.strokeRect(sx, w.y + 4, 18, w.h - 6);
            }
            ctx.fillStyle = '#3B424C';
            ctx.fillRect(w.x - 2, w.y - 4, w.w + 4, 8);
          }
        }

        function drawBuilding(ctx, b, timeSec) {
          ctx.fillStyle = 'rgba(36, 31, 28, 0.14)';
          drawRoundedRect(ctx, b.x + 8, b.y + 10, b.w, b.h, 8);
          ctx.fill();

          var wallY = b.y + b.h * 0.56;
          var wallH = b.h * 0.44;

          if (b.kind === 'gwanna') {
            ctx.fillStyle = '#F5EFE2';
            ctx.fillRect(b.x + 10, wallY, b.w - 20, wallH);
            ctx.fillStyle = '#9E2E24';
            for (var px = b.x + 18; px <= b.x + b.w - 24; px += 52) {
              ctx.fillRect(px, wallY, 8, wallH);
            }
            ctx.fillStyle = '#5E3A22';
            ctx.fillRect(b.doorX - 24, wallY + 8, 48, wallH - 8);
            ctx.fillStyle = '#C23B2B';
            ctx.beginPath();
            ctx.arc(b.x + 56, b.y + b.h - 14, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#F2DEC0';
            ctx.beginPath();
            ctx.arc(b.x + 56, b.y + b.h - 14, 6, 0, Math.PI * 2);
            ctx.fill();
          } else if (b.kind === 'giwa_house' || b.kind === 'seodang') {
            ctx.fillStyle = '#F4EFE4';
            ctx.fillRect(b.x + 8, wallY, b.w - 16, wallH);
            ctx.fillStyle = '#6B482B';
            ctx.fillRect(b.x + 12, wallY, 7, wallH);
            ctx.fillRect(b.x + b.w - 19, wallY, 7, wallH);
            ctx.fillStyle = '#FAF6EB';
            ctx.fillRect(b.doorX - 28, wallY + 8, 56, wallH - 10);
            ctx.strokeStyle = '#7D5836';
            ctx.lineWidth = 2;
            ctx.strokeRect(b.doorX - 28, wallY + 8, 56, wallH - 10);
            ctx.beginPath();
            ctx.moveTo(b.doorX, wallY + 8);
            ctx.lineTo(b.doorX, wallY + wallH - 2);
            ctx.stroke();
          } else if (b.kind === 'choga_house' || b.kind === 'blacksmith') {
            ctx.fillStyle = '#D9C8AA';
            ctx.fillRect(b.x + 10, wallY, b.w - 20, wallH);
            ctx.fillStyle = '#6E4E32';
            ctx.fillRect(b.doorX - 18, wallY + 10, 36, wallH - 10);

            if (b.kind === 'choga_house') {
              ctx.fillStyle = '#4A3324';
              ctx.beginPath();
              ctx.arc(b.x + b.w - 18, b.y + b.h - 10, 8, 0, Math.PI * 2);
              ctx.arc(b.x + b.w - 3, b.y + b.h - 12, 6, 0, Math.PI * 2);
              ctx.fill();
            } else {
              var glow = 0.6 + 0.4 * Math.sin(timeSec * 7);
              ctx.fillStyle = 'rgba(235, 94, 40, ' + glow + ')';
              ctx.beginPath();
              ctx.arc(b.x + 34, b.y + b.h - 16, 12, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#33363B';
              ctx.fillRect(b.x + b.w - 38, b.y + b.h - 20, 20, 12);
            }
          } else {
            ctx.fillStyle = '#E8D8BE';
            ctx.fillRect(b.x + 8, wallY, b.w - 16, wallH);
            ctx.fillStyle = '#8B5E34';
            ctx.fillRect(b.x + 18, b.y + b.h - 22, b.w - 36, 18);

            if (b.kind === 'market_silk') {
              var colors = ['#C23B2B', '#1E4D7B', '#C88A1E', '#3A7D58'];
              for (var ci = 0; ci < colors.length; ci++) {
                ctx.fillStyle = colors[ci];
                ctx.fillRect(b.x + 28 + ci * 28, b.y + b.h - 20, 20, 13);
              }
            } else if (b.kind === 'market_herbs') {
              ctx.fillStyle = '#52794C';
              ctx.beginPath();
              ctx.arc(b.x + 48, b.y + b.h - 13, 9, 0, Math.PI * 2);
              ctx.arc(b.x + 82, b.y + b.h - 13, 9, 0, Math.PI * 2);
              ctx.arc(b.x + 116, b.y + b.h - 13, 9, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = '#D8C28C';
              drawRoundedRect(ctx, b.x + 34, b.y + b.h - 22, 26, 16, 5);
              ctx.fill();
              drawRoundedRect(ctx, b.x + 70, b.y + b.h - 22, 26, 16, 5);
              ctx.fill();
              drawRoundedRect(ctx, b.x + 106, b.y + b.h - 22, 26, 16, 5);
              ctx.fill();
            }
          }

          var roofH = b.h * 0.62;
          if (b.kind === 'choga_house') {
            ctx.fillStyle = '#D4B46A';
            ctx.beginPath();
            ctx.moveTo(b.x - 8, b.y + roofH);
            ctx.quadraticCurveTo(b.x + b.w / 2, b.y - 16, b.x + b.w + 8, b.y + roofH);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#9E7E3D';
            ctx.lineWidth = 2;
            ctx.stroke();
          } else if (b.kind.indexOf('market_') === 0) {
            var awningColor = b.kind === 'market_silk' ? '#A8382B' : b.kind === 'market_herbs' ? '#2F6B48' : '#B57B24';
            ctx.fillStyle = awningColor;
            ctx.beginPath();
            ctx.moveTo(b.x - 4, b.y + roofH + 4);
            ctx.lineTo(b.x + 12, b.y + 8);
            ctx.lineTo(b.x + b.w - 12, b.y + 8);
            ctx.lineTo(b.x + b.w + 4, b.y + roofH + 4);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 248, 232, 0.25)';
            for (var sx = b.x + 16; sx < b.x + b.w - 20; sx += 28) {
              ctx.fillRect(sx, b.y + 10, 12, roofH - 8);
            }
          } else {
            var roofColor = b.kind === 'gwanna' ? '#2A384C' : b.kind === 'blacksmith' ? '#4D453F' : '#353F4B';
            ctx.fillStyle = roofColor;
            ctx.beginPath();
            ctx.moveTo(b.x - 12, b.y + roofH + 4);
            ctx.quadraticCurveTo(b.x + 14, b.y + 18, b.x + 28, b.y + 8);
            ctx.lineTo(b.x + b.w - 28, b.y + 8);
            ctx.quadraticCurveTo(b.x + b.w - 14, b.y + 18, b.x + b.w + 12, b.y + roofH + 4);
            ctx.quadraticCurveTo(b.x + b.w / 2, b.y + roofH - 6, b.x - 12, b.y + roofH + 4);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#D5D8DC';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(b.x + 26, b.y + 9);
            ctx.lineTo(b.x + b.w - 26, b.y + 9);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,255,255,0.14)';
            ctx.lineWidth = 1.5;
            for (var rx = b.x + 16; rx < b.x + b.w - 14; rx += 16) {
              ctx.beginPath();
              ctx.moveTo(rx, b.y + 12);
              ctx.lineTo(rx, b.y + roofH);
              ctx.stroke();
            }
          }

          var labelW = Math.max(96, b.name.length * 14 + 24);
          var labelX = b.x + b.w / 2 - labelW / 2;
          var labelY = b.y + 22;
          ctx.fillStyle = 'rgba(252, 248, 238, 0.94)';
          drawRoundedRect(ctx, labelX, labelY, labelW, 24, 5);
          ctx.fill();
          ctx.strokeStyle = '#6B563E';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#231F1D';
          ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(b.name, b.x + b.w / 2, labelY + 16);
        }

        function drawTree(ctx, t) {
          ctx.fillStyle = 'rgba(36, 31, 28, 0.14)';
          ctx.beginPath();
          ctx.ellipse(t.x + 4, t.y + 14, t.radius * 0.9, t.radius * 0.45, 0, 0, Math.PI * 2);
          ctx.fill();

          if (t.kind === 'pine') {
            ctx.fillStyle = '#6E4C2E';
            ctx.fillRect(t.x - 4, t.y - 4, 8, 18);
            ctx.fillStyle = '#2B5B3B';
            ctx.beginPath();
            ctx.arc(t.x, t.y - 14, t.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#38704A';
            ctx.beginPath();
            ctx.arc(t.x - 6, t.y - 18, t.radius * 0.65, 0, Math.PI * 2);
            ctx.fill();
          } else if (t.kind === 'plum') {
            ctx.fillStyle = '#5D4029';
            ctx.fillRect(t.x - 3.5, t.y - 4, 7, 16);
            ctx.fillStyle = '#F2C6CE';
            ctx.beginPath();
            ctx.arc(t.x, t.y - 14, t.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FBE4E8';
            ctx.beginPath();
            ctx.arc(t.x + 5, t.y - 18, t.radius * 0.6, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.strokeStyle = '#3E7A48';
            ctx.lineWidth = 5;
            var offsets = [-8, 0, 8];
            for (var i = 0; i < offsets.length; i++) {
              ctx.beginPath();
              ctx.moveTo(t.x + offsets[i], t.y + 10);
              ctx.lineTo(t.x + offsets[i] + (i - 1) * 3, t.y - 28);
              ctx.stroke();
            }
            ctx.fillStyle = '#569A5E';
            ctx.beginPath();
            ctx.arc(t.x, t.y - 26, 15, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function drawCharacterSprite(ctx, opts) {
          var isProstrating = opts.royalPosture === 'prostrate';
          var isGukgung = opts.royalPosture === 'gukgung';
          var isEup = opts.royalPosture === 'eup';

          ctx.save();
          ctx.translate(opts.x, opts.y);

          ctx.fillStyle = opts.isPlayer ? 'rgba(30, 77, 123, 0.24)' : 'rgba(36, 31, 28, 0.18)';
          ctx.beginPath();
          ctx.ellipse(0, 14, isProstrating ? 19 : 13, isProstrating ? 7 : 6, 0, 0, Math.PI * 2);
          ctx.fill();

          if (opts.isPlayer) {
            ctx.strokeStyle = '#1E4D7B';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, 14, 16, 8, 0, 0, Math.PI * 2);
            ctx.stroke();
          }

          var legSwing = opts.isMoving ? Math.sin(opts.walkPhase * 12) * 3.5 : 0;

          if (isGukgung || isEup) {
            ctx.fillStyle = '#3B322C';
            ctx.fillRect(-6, 6, 4.5, 8);
            ctx.fillRect(1.5, 6, 4.5, 8);
          }

          ctx.save();
          if (isProstrating) {
            ctx.translate(0, 9);
            ctx.scale(1.06, 0.5);
          } else if (isGukgung) {
            ctx.translate(0, 4);
            ctx.rotate(0.46);
          } else if (isEup) {
            ctx.translate(0, 1);
            ctx.rotate(0.11);
          } else if (opts.isBowing) {
            ctx.translate(0, 3);
            ctx.rotate(0.24);
          }

          if (!isGukgung && !isEup) {
            ctx.fillStyle = '#3B322C';
            ctx.fillRect(-6, 6 + legSwing, 4.5, 8);
            ctx.fillRect(1.5, 6 - legSwing, 4.5, 8);
          }

          ctx.fillStyle = opts.outfitColor;
          drawRoundedRect(ctx, -10, -8, 20, 17, 5);
          ctx.fill();
          ctx.strokeStyle = '#FAF6EB';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-4, -8);
          ctx.lineTo(0, -1);
          ctx.lineTo(4, -8);
          ctx.stroke();

          if (isGukgung || isEup) {
            ctx.fillStyle = '#F5CEA8';
            ctx.beginPath();
            ctx.arc(isGukgung ? 7 : 4, isGukgung ? 4 : -1, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = opts.outfitColor;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-6, -2);
            ctx.lineTo(isGukgung ? 6 : 3, isGukgung ? 4 : -1);
            ctx.moveTo(6, -2);
            ctx.lineTo(isGukgung ? 8 : 5, isGukgung ? 4 : -1);
            ctx.stroke();
          } else if (isProstrating) {
            ctx.fillStyle = '#F5CEA8';
            ctx.beginPath();
            ctx.arc(-5, 9, 2.8, 0, Math.PI * 2);
            ctx.arc(5, 9, 2.8, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.fillStyle = '#F5CEA8';
          ctx.beginPath();
          ctx.arc(0, -15, 9, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#231F1D';
          var eyeY = opts.isBowing || isProstrating || isGukgung ? -12.5 : -14.5;
          ctx.beginPath();
          ctx.arc(-3, eyeY, 1.3, 0, Math.PI * 2);
          ctx.arc(3, eyeY, 1.3, 0, Math.PI * 2);
          ctx.fill();

          if (opts.hatType === 'gat') {
            ctx.fillStyle = '#211D1B';
            ctx.beginPath();
            ctx.ellipse(0, -21, 16, 4.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-5.5, -31, 11, 10);
          } else if (opts.hatType === 'jungin_cap') {
            ctx.fillStyle = '#2B2624';
            ctx.fillRect(-8, -24, 16, 4);
            ctx.fillRect(-6, -30, 12, 8);
            ctx.fillRect(-13, -23, 5, 2.5);
            ctx.fillRect(8, -23, 5, 2.5);
          } else if (opts.hatType === 'paeraengi') {
            ctx.fillStyle = '#D5B278';
            ctx.beginPath();
            ctx.moveTo(-15, -19);
            ctx.quadraticCurveTo(0, -33, 15, -19);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#9E7B44';
            ctx.lineWidth = 1.3;
            ctx.stroke();
          } else if (opts.hatType === 'binyeo') {
            ctx.fillStyle = '#231F1D';
            ctx.beginPath();
            ctx.arc(0, -20, 9.5, Math.PI, 0);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, -25, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#C88A1E';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-8, -25);
            ctx.lineTo(8, -25);
            ctx.stroke();
          } else {
            ctx.fillStyle = '#2B2522';
            ctx.beginPath();
            ctx.arc(0, -26, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#C23B2B';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-8.5, -19);
            ctx.lineTo(8.5, -19);
            ctx.stroke();
          }

          if (opts.carryingItem) {
            ctx.fillStyle = opts.carryingItem.indexOf('쌀') !== -1 ? '#DFC793' : '#C23B2B';
            drawRoundedRect(ctx, 10, -8, 12, 13, 3);
            ctx.fill();
            ctx.strokeStyle = '#5C4426';
            ctx.lineWidth = 1.2;
            ctx.stroke();
          }

          ctx.restore();

          var tagText = opts.subLabel ? opts.nameLabel + ' (' + opts.subLabel + ')' : opts.nameLabel;
          ctx.font = 'bold 11px "Noto Sans KR", sans-serif';
          var tw = ctx.measureText(tagText).width + 12;
          ctx.fillStyle = opts.isPlayer ? 'rgba(30, 77, 123, 0.92)' : 'rgba(252, 248, 238, 0.9)';
          drawRoundedRect(ctx, -tw / 2, 18, tw, 18, 4);
          ctx.fill();
          ctx.fillStyle = opts.isPlayer ? '#FFFFFF' : '#231F1D';
          ctx.textAlign = 'center';
          ctx.fillText(tagText, 0, 31);

          if (opts.royalPosture) {
            var postureLabel = opts.royalPosture === 'prostrate' ? '엎드려 절' : opts.royalPosture === 'gukgung' ? '국궁(鞠躬)' : '읍(揖)';
            var badgeColor = opts.royalPosture === 'prostrate' ? '#7C5438' : opts.royalPosture === 'gukgung' ? '#1E4D7B' : '#7A2848';
            ctx.font = 'bold 10px "Noto Sans KR", sans-serif';
            var pw = ctx.measureText(postureLabel).width + 10;
            var badgeY = isProstrating ? -28 : -44;
            ctx.fillStyle = badgeColor;
            drawRoundedRect(ctx, -pw / 2, badgeY, pw, 15, 4);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText(postureLabel, 0, badgeY + 11);
          }

          ctx.restore();
        }

        function drawSpeechBubble(ctx, x, y, text, variant) {
          ctx.save();
          ctx.font = 'bold 12px "Noto Sans KR", sans-serif';
          var paddingX = 10;
          var maxW = 190;
          var words = text.split(' ');
          var lines = [];
          var line = '';
          for (var i = 0; i < words.length; i++) {
            var test = line ? line + ' ' + words[i] : words[i];
            if (ctx.measureText(test).width > maxW) {
              if (line) lines.push(line);
              line = words[i];
            } else {
              line = test;
            }
          }
          if (line) lines.push(line);

          var maxLineW = 0;
          for (var j = 0; j < lines.length; j++) {
            maxLineW = Math.max(maxLineW, ctx.measureText(lines[j]).width);
          }
          var boxW = Math.min(maxW, maxLineW) + paddingX * 2;
          var boxH = lines.length * 16 + 12;
          var bx = x - boxW / 2;
          var by = y - 44 - boxH;

          ctx.fillStyle = variant === 'warning' ? '#C23B2B' : variant === 'player' ? '#1E4D7B' : 'rgba(252, 249, 242, 0.96)';
          drawRoundedRect(ctx, bx, by, boxW, boxH, 7);
          ctx.fill();
          ctx.strokeStyle = variant === 'normal' ? '#8A7963' : '#FFFFFF';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = variant === 'normal' ? '#231F1D' : '#FFFFFF';
          ctx.textAlign = 'center';
          for (var k = 0; k < lines.length; k++) {
            ctx.fillText(lines[k], x, by + 18 + k * 16);
          }
          ctx.restore();
        }

        function drawRoyalProcession(ctx, royal, timeSec) {
          if (royal.phase !== 'PASSING') return;
          var cx = royal.x;
          var cy = royal.y;

          var guardOffsets = [-165, -120, 120, 165];
          for (var i = 0; i < guardOffsets.length; i++) {
            var gx = cx + guardOffsets[i];
            var gy = cy + (i % 2 === 0 ? -24 : 24);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(gx, gy + 13, 12, 5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#B82E24';
            drawRoundedRect(ctx, gx - 9, gy - 8, 18, 16, 4);
            ctx.fill();
            ctx.fillStyle = '#F2C8A2';
            ctx.beginPath();
            ctx.arc(gx, gy - 14, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2B2624';
            ctx.beginPath();
            ctx.ellipse(gx, gy - 20, 12, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#5C3A21';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(gx + 8, gy + 8);
            ctx.lineTo(gx + 8, gy - 42);
            ctx.stroke();

            ctx.fillStyle = i < 2 ? '#C88A1E' : '#1E4D7B';
            ctx.fillRect(gx + 9, gy - 42, 16, 11);
          }

          var bob = Math.sin(timeSec * 8) * 1.8;
          ctx.fillStyle = '#6B4423';
          ctx.fillRect(cx - 72, cy - 2 + bob, 144, 5);
          ctx.fillRect(cx - 72, cy + 12 + bob, 144, 5);

          ctx.fillStyle = '#C23B2B';
          drawRoundedRect(ctx, cx - 34, cy - 28 + bob, 68, 44, 6);
          ctx.fill();
          ctx.strokeStyle = '#EAB308';
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.fillStyle = '#D99B26';
          ctx.beginPath();
          ctx.moveTo(cx - 42, cy - 26 + bob);
          ctx.lineTo(cx, cy - 48 + bob);
          ctx.lineTo(cx + 42, cy - 26 + bob);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#7A4F0B';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = '#FFF9E6';
          ctx.font = 'bold 12px "Gowun Batang", serif';
          ctx.textAlign = 'center';
          ctx.fillText('임금님 어가', cx, cy - 2 + bob);

          var parasols = [-52, 52];
          for (var pi = 0; pi < parasols.length; pi++) {
            ctx.fillStyle = '#C88A1E';
            ctx.beginPath();
            ctx.arc(cx + parasols[pi], cy - 28 + bob, 14, Math.PI, 0);
            ctx.fill();
          }
        }

        function renderJoseonWorld(ctx, data) {
          var player = data.player;
          var npcs = data.npcs;
          var royal = data.royal;
          var targetNpcId = data.targetNpcId;
          var timeSec = data.timeSec;
          var cameraX = data.cameraX;
          var cameraY = data.cameraY;

          ctx.save();
          ctx.clearRect(0, 0, VIEW_W, VIEW_H);
          ctx.translate(-cameraX, -cameraY);

          drawTerrain(ctx, timeSec, royal);
          drawStoneWalls(ctx);

          var drawables = [];
          for (var bi = 0; bi < BUILDINGS.length; bi++) {
            (function (b) {
              drawables.push({
                y: b.y + b.h,
                draw: function () { drawBuilding(ctx, b, timeSec); }
              });
            })(BUILDINGS[bi]);
          }

          for (var ti = 0; ti < TREES.length; ti++) {
            (function (t) {
              drawables.push({
                y: t.y + 10,
                draw: function () { drawTree(ctx, t); }
              });
            })(TREES[ti]);
          }

          for (var ni = 0; ni < npcs.length; ni++) {
            (function (npc) {
              drawables.push({
                y: npc.currentY,
                draw: function () {
                  var isQuestTarget = npc.id === targetNpcId;
                  if (isQuestTarget) {
                    var ringR = 22 + Math.sin(timeSec * 5) * 4;
                    ctx.strokeStyle = '#C88A1E';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.ellipse(npc.currentX, npc.currentY + 12, ringR, ringR * 0.55, 0, 0, Math.PI * 2);
                    ctx.stroke();
                  }

                  var requiresBow = mustBowToNpc(player.role.rank, npc.rank) && npc.greetedTimer <= 0;
                  if (requiresBow && npc.approachWarningTimer > 0) {
                    var progress = Math.min(1, npc.approachWarningTimer / 2.2);
                    ctx.strokeStyle = progress > 0.6 ? '#C23B2B' : '#D97706';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(npc.currentX, npc.currentY + 10, 26, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress);
                    ctx.stroke();
                  }

                  var moving = Math.hypot(npc.vx, npc.vy) > 4;
                  drawCharacterSprite(ctx, {
                    x: npc.currentX,
                    y: npc.currentY,
                    outfitColor: npc.outfitColor,
                    hatType: npc.hatType,
                    walkPhase: timeSec,
                    isMoving: moving,
                    isBowing: npc.isBowingToPlayer,
                    royalPosture: npc.royalPosture,
                    nameLabel: npc.name,
                    subLabel: npc.roleTitle
                  });

                  if (isQuestTarget) {
                    var bounce = Math.sin(timeSec * 6) * 3;
                    ctx.fillStyle = '#C88A1E';
                    ctx.beginPath();
                    ctx.moveTo(npc.currentX, npc.currentY - 36 + bounce);
                    ctx.lineTo(npc.currentX - 7, npc.currentY - 47 + bounce);
                    ctx.lineTo(npc.currentX + 7, npc.currentY - 47 + bounce);
                    ctx.closePath();
                    ctx.fill();
                  }

                  if (npc.bubbleText && npc.bubbleTimer > 0) {
                    drawSpeechBubble(ctx, npc.currentX, npc.currentY, npc.bubbleText, npc.approachWarningTimer > 0 ? 'warning' : 'normal');
                  }
                }
              });
            })(npcs[ni]);
          }

          drawables.push({
            y: player.y,
            draw: function () {
              var moving = Math.hypot(player.vx, player.vy) > 4;
              var royalPosture = player.isBowing && royal.phase !== 'IDLE' ? 'prostrate' : null;
              var hatMap = { yangban: 'gat', jungin: 'jungin_cap', sangmin: 'paeraengi', cheonmin: 'bandana' };
              drawCharacterSprite(ctx, {
                x: player.x,
                y: player.y,
                outfitColor: player.role.accentHex,
                hatType: hatMap[player.role.id],
                walkPhase: player.walkTime,
                isMoving: moving,
                isBowing: player.isBowing,
                royalPosture: royalPosture,
                nameLabel: player.role.characterName,
                isPlayer: true,
                carryingItem: player.carryingItem
              });
              if (player.bubbleText) {
                drawSpeechBubble(ctx, player.x, player.y, player.bubbleText, 'player');
              }
            }
          });

          drawables.sort(function (a, b) { return a.y - b.y; });
          for (var di = 0; di < drawables.length; di++) {
            drawables[di].draw();
          }

          drawRoyalProcession(ctx, royal, timeSec);

          if (player.rudeFlashTimer > 0) {
            ctx.strokeStyle = 'rgba(194, 59, 43, 0.85)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(player.x, player.y, 44 * (1 - player.rudeFlashTimer * 2 + 0.5), 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.restore();

          if (targetNpcId) {
            var target = null;
            for (var k = 0; k < npcs.length; k++) {
              if (npcs[k].id === targetNpcId) { target = npcs[k]; break; }
            }
            if (target) {
              var screenX = target.currentX - cameraX;
              var screenY = target.currentY - cameraY;
              if (screenX < 20 || screenX > VIEW_W - 20 || screenY < 20 || screenY > VIEW_H - 20) {
                var angle = Math.atan2(screenY - VIEW_H / 2, screenX - VIEW_W / 2);
                var edgeX = Math.max(42, Math.min(VIEW_W - 42, VIEW_W / 2 + Math.cos(angle) * (VIEW_W * 0.44)));
                var edgeY = Math.max(42, Math.min(VIEW_H - 42, VIEW_H / 2 + Math.sin(angle) * (VIEW_H * 0.42)));

                ctx.save();
                ctx.translate(edgeX, edgeY);
                ctx.fillStyle = 'rgba(200, 138, 30, 0.95)';
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.rotate(angle);
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.moveTo(8, 0);
                ctx.lineTo(-5, -6);
                ctx.lineTo(-5, 6);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
              }
            }
          }
        }

        // 5. APPLICATION STATE & COLLISION

        function loadClearedRoles() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return [];
            var parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              return parsed.filter(function (id) {
                return ROLES.some(function (r) { return r.id === id; });
              });
            }
          } catch (e) {}
          return [];
        }

        function saveClearedRoles(list) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
          } catch (e) {}
        }

        var appState = {
          clearedRoles: loadClearedRoles(),
          activeRole: null,
          showGuide: false,
          showTable: false,
          showMasterEnding: false,
          game: null
        };

        function createInitialNpcs() {
          return NPCS.map(function (n) {
            return Object.assign({}, n, {
              currentX: n.x,
              currentY: n.y,
              vx: 0,
              vy: 0,
              facing: 'down',
              patrolIndex: 0,
              greetedTimer: 0,
              approachWarningTimer: 0,
              isBowingToPlayer: false,
              royalPosture: null,
              royalBubbleShown: false,
              bubbleText: null,
              bubbleTimer: 0
            });
          });
        }

        function isColliding(x, y, radius) {
          if (x < radius + 12 || x > MAP_WIDTH - radius - 12 || y < radius + 12 || y > MAP_HEIGHT - radius - 12) {
            return true;
          }
          if (x + radius > STREAM_X_MIN && x - radius < STREAM_X_MAX) {
            var onBridge = BRIDGES.some(function (b) {
              return y >= b.y + 4 && y <= b.y + b.h - 4;
            });
            if (!onBridge) return true;
          }
          for (var i = 0; i < BUILDINGS.length; i++) {
            var b = BUILDINGS[i];
            if (x + radius > b.x + 8 && x - radius < b.x + b.w - 8 && y + radius > b.y + 22 && y - radius < b.y + b.h) {
              return true;
            }
          }
          for (var j = 0; j < STONE_WALLS.length; j++) {
            var w = STONE_WALLS[j];
            if (x + radius > w.x && x - radius < w.x + w.w && y + radius > w.y && y - radius < w.y + w.h) {
              return true;
            }
          }
          for (var k = 0; k < TREES.length; k++) {
            var t = TREES[k];
            if (Math.hypot(x - t.x, y - (t.y + 4)) < radius + t.radius * 0.42) {
              return true;
            }
          }
          return false;
        }

          var modalHtml = '';

                    '<h1 class="hero-title">신분을 골라 한양 아랫마을의 하루를 살아 보세요</h1>' +

            '</div>' + modalHtml;

          // Bind events
          document.getElementById('btn-open-guide').onclick = function () { appState.showGuide = true; renderMenuScreen(); };
          document.getElementById('btn-open-table').onclick = function () { appState.showTable = true; renderMenuScreen(); };
          var masterBtn = document.getElementById('btn-open-master');
          if (masterBtn) masterBtn.onclick = function () { appState.showMasterEnding = true; renderMenuScreen(); };

          var roleBtns = document.querySelectorAll('[data-select-role]');
          for (var i = 0; i < roleBtns.length; i++) {
            roleBtns[i].onclick = function () {
              var id = this.getAttribute('data-select-role');
              var found = ROLES.find(function (r) { return r.id === id; });

            document.getElementById('btn-ok-guide').onclick = function () { appState.showGuide = false; renderMenuScreen(); };

            document.getElementById('btn-ok-table').onclick = function () { appState.showTable = false; renderMenuScreen(); };
          }
          if (appState.showMasterEnding) {
            document.getElementById('btn-close-master').onclick = function () { appState.showMasterEnding = false; renderMenuScreen(); };
            document.getElementById('btn-done-master').onclick = function () { appState.showMasterEnding = false; renderMenuScreen(); };
            document.getElementById('btn-reset-all').onclick = function () {
              appState.clearedRoles = [];
              saveClearedRoles([]);
              appState.showMasterEnding = false;
